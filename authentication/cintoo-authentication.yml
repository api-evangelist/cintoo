model: >-
  The Cintoo API relies on JWT tokens with the standard Access Token + Refresh Token pair.
  The first acquisition of the token pair requires a manual step (via the cintoo-login CLI or
  OAuth authorize flow) for security reasons; afterward it can be fully automated. Every request
  (except the authentication endpoints) carries `Authorization: Bearer <access_token>`.
tokens:
  access_token:
    ttl: 3h
    stateless: true
    usage: authenticates each API call; may be used in parallel (no concurrent limit)
  refresh_token:
    ttl: months
    stateful: true
    single_use: true
    concurrent_limit: 10 valid refresh tokens per user
    usage: used once to obtain a new Access Token + Refresh Token pair; cannot make API calls
