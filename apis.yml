aid: cintoo
name: Cintoo
description: >-
  Cintoo is a cloud-based reality-capture and digital-twin platform that transforms 3D
  laser-scan point-cloud data into high-fidelity, streamable 3D meshes hosted in the cloud.
  Teams across AEC (architecture, engineering, construction), BIM, GIS, and asset management use
  Cintoo Cloud to store, visualize, classify, annotate, measure, and share reality-capture data,
  and to run scan-to-BIM and digital-twin workflows. The Cintoo Open API 2.0.0 (OpenAPI 3.0.3,
  currently beta) exposes 100 operations across accounts, subscriptions, users, groups, roles,
  projects, work zones, files, annotations, crops, measurements, tags, share links, and
  integrations (Autodesk, Konekt), secured with OAuth2 authorization-code and JWT Bearer tokens.
  Cintoo was surfaced as a portfolio company of Partech and enriched from its public developer
  surface by the API Evangelist pipeline.
